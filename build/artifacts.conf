# Artifact manifest — the single source of truth for versions and URLs.
# Sourced by build/ and tests/ scripts. Contains no secrets; never add any.
#
# Bumping SystemRescue means rewriting the stick (the volume label is a boot
# requirement, and it is derived from the version below). Bumping HAOS means
# swapping one file on an existing stick.

SYSRESCUE_VERSION="13.02"
SYSRESCUE_ISO="systemrescue-${SYSRESCUE_VERSION}-amd64.iso"
SYSRESCUE_URL="https://fastly-cdn.system-rescue.org/releases/${SYSRESCUE_VERSION}/${SYSRESCUE_ISO}"
SYSRESCUE_SHA_URL="${SYSRESCUE_URL}.sha256"

# Boot requirement: the stick's FAT32 volume label must equal this, or the
# medium will not boot. Derived so it cannot drift from the version.
SYSRESCUE_LABEL="RESCUE$(printf '%s' "${SYSRESCUE_VERSION}" | tr -d '.')"

USBWRITER_VERSION="1.1.1"
USBWRITER_FILE="sysrescueusbwriter-x86_64.AppImage"
USBWRITER_URL="https://fastly-cdn.system-rescue.org/download/usbwriter/${USBWRITER_VERSION}/${USBWRITER_FILE}"

HAOS_VERSION="18.2"
HAOS_IMG="haos_generic-x86-64-${HAOS_VERSION}.img.xz"
HAOS_URL="https://github.com/home-assistant/operating-system/releases/download/${HAOS_VERSION}/${HAOS_IMG}"

# Upstream publishes no checksum for the HAOS images (verified against the
# release asset list for 18.2 — 35 assets, none a digest). The sidecar is
# therefore self-generated at fetch time: it detects artifact corruption and
# stick rot, but does NOT authenticate the download.
HAOS_SHA_SIDECAR="${HAOS_IMG}.sha256"

# Written at fetch time; Task 7 needs the exact uncompressed length to bound
# its byte-comparison at the image boundary rather than the disk boundary.
HAOS_SIZE_FILE="${HAOS_IMG}.uncompressed-bytes"
